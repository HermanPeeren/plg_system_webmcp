PLG_SYSTEM_WEBMCP="System - WebMCP"
PLG_SYSTEM_WEBMCP_XML_DESCRIPTION="Offers this site's articles and J2Commerce shop to AI agents in the browser, as WebMCP tools. An agent can then search and read articles, list products and fill the cart without clicking through the pages. The visitor stays in control: the agent works in the visitor's own browser session, and an order is only placed by the visitor on the checkout page."
